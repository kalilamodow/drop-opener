[project]
name = "drop-opener"
version = "0.1.0"
description = "opens rocket league drops"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx2>=2.16.0",
    "msgspec>=0.22.0",
    "psutil>=7.2.2",
    "types-psutil>=7.2.2.20260906",
]

[project.scripts]
drop-opener = "drop_opener:_start"

[tool.pyrefly]
interpreter-path = ".venv/bin/python"
site-package-path = [".venv/lib/site-packages"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
